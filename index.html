<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Governance Readiness Framework — Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  :root{
    --navy:#1f3864;
    --navy-deep:#142544;
    --paper:#faf9f6;
    --paper-panel:#ffffff;
    --line:#dcdad3;
    --ink:#26241f;
    --ink-soft:#6b6858;
    --tech:#1f3864;
    --social:#8a5a34;
    --tech-bg:#e8edf6;
    --social-bg:#f3e9de;
    --ok:#3f6b4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---- shell ---- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:230px; flex-shrink:0;
    background:var(--navy-deep);
    color:#e8e6de;
    padding:28px 18px;
    position:sticky; top:0; height:100vh;
    overflow-y:auto;
  }
  .brand{
    font-family:'Source Serif 4',serif;
    font-size:15px; line-height:1.3; font-weight:600;
    color:#fff; margin-bottom:4px; letter-spacing:.2px;
  }
  .brand-sub{font-size:11px; color:#9aa4bd; margin-bottom:26px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 10px; border-radius:6px;
    font-size:13.5px; color:#c7cbdb; cursor:pointer;
    margin-bottom:2px; transition:background .15s;
    border-left:2px solid transparent;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(255,255,255,.1); color:#fff; border-left:2px solid #d3a25e;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:#5c6786; flex-shrink:0;}
  .nav-item.active .nav-dot{background:#d3a25e;}
  .nav-progress{font-size:10px; color:#7a839e; margin-left:auto;}

  .main{flex:1; min-width:0; padding:36px 48px 90px; max-width:900px;}

  /* ---- track diagram (signature element) ---- */
  .track{
    background:var(--paper-panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 20px 14px; margin-bottom:28px;
  }
  .track-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); margin-bottom:10px;}
  .track-row{display:flex; align-items:center; gap:0;}
  .track-row .lane-label{font-size:10.5px; width:64px; color:var(--ink-soft); flex-shrink:0;}
  .lane{display:flex; align-items:center; flex:1;}
  .stage{
    display:flex; flex-direction:column; align-items:center; flex:1; position:relative;
  }
  .stage .dot{
    width:15px;height:15px;border-radius:50%; background:#e3e1d8; border:2px solid #d3d0c4;
    transition:all .2s; z-index:1;
  }
  .stage .connector{
    position:absolute; top:6px; left:-50%; width:100%; height:2px; background:#d3d0c4; z-index:0;
  }
  .stage:first-child .connector{display:none;}
  .stage .stage-name{font-size:9.5px; text-align:center; margin-top:5px; color:var(--ink-soft); line-height:1.2; max-width:78px;}
  .stage.tech-on .dot{background:var(--tech); border-color:var(--tech);}
  .stage.tech-on .connector{background:var(--tech);}
  .stage.social-on .dot{background:var(--social); border-color:var(--social);}
  .stage.social-on .connector{background:var(--social);}
  .stage.current .dot{box-shadow:0 0 0 4px rgba(211,162,94,.35); background:#d3a25e; border-color:#d3a25e;}
  .stage.current .stage-name{color:var(--ink); font-weight:600;}

  /* ---- headers ---- */
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:6px;}
  .page-title{font-size:28px; font-weight:600; margin:0 0 6px; color:var(--ink);}
  .page-sub{color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin-bottom:26px; max-width:640px;}

  /* ---- step chrome ---- */
  .stepper-head{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .step-pill{
    font-size:11px; padding:4px 10px; border-radius:20px; background:var(--tech-bg); color:var(--navy);
    font-weight:600; letter-spacing:.03em;
  }
  .social-mod .step-pill{background:var(--social-bg); color:var(--social);}
  .step-dots{display:flex; gap:6px;}
  .step-dots span{width:7px;height:7px;border-radius:50%; background:var(--line); cursor:pointer;}
  .step-dots span.on{background:var(--navy);}
  .social-mod .step-dots span.on{background:var(--social);}

  .card{
    background:var(--paper-panel); border:1px solid var(--line); border-radius:10px;
    padding:26px 28px; margin-bottom:18px;
  }
  .card h3{font-size:17px; margin:0 0 4px; font-weight:600;}
  .card .hint{font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-bottom:16px; line-height:1.5;}

  label{display:block; font-size:12.5px; font-weight:600; color:var(--ink); margin:14px 0 5px;}
  label:first-of-type{margin-top:0;}
  input[type=text], textarea, select{
    width:100%; border:1px solid var(--line); border-radius:6px; padding:9px 11px;
    font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink); background:#fffefc;
  }
  input[type=text]:focus, textarea:focus, select:focus{outline:2px solid var(--navy); outline-offset:1px; border-color:var(--navy);}
  textarea{resize:vertical; min-height:64px; line-height:1.5;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .wc{font-size:11px; color:var(--ink-soft); text-align:right; margin-top:4px;}
  .wc.over{color:#a3432f; font-weight:600;}

  .repeat-list{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .repeat-row{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; align-items:start;}
  .repeat-row.two{grid-template-columns:1fr 1fr auto;}
  .repeat-row.four{grid-template-columns:1fr 1fr 1fr 1fr auto;}
  .repeat-row input{font-size:12.5px; padding:7px 9px;}
  .rm-btn{
    background:none; border:1px solid var(--line); border-radius:6px; color:var(--ink-soft);
    width:30px; height:30px; cursor:pointer; font-size:14px; line-height:1;
  }
  .rm-btn:hover{border-color:#a3432f; color:#a3432f;}
  .add-btn{
    margin-top:10px; background:none; border:1px dashed #b7b4a7; border-radius:6px;
    padding:8px 14px; font-size:12.5px; color:var(--ink-soft); cursor:pointer; font-weight:500;
  }
  .add-btn:hover{border-color:var(--navy); color:var(--navy);}

  .checklist{list-style:none; margin:0; padding:0;}
  .checklist li{display:flex; align-items:flex-start; gap:9px; padding:7px 0; font-size:13.5px; border-bottom:1px solid #f0efe9;}
  .checklist li:last-child{border-bottom:none;}
  .checklist input[type=checkbox]{width:15px;height:15px; margin-top:2px; accent-color:var(--navy);}
  .checklist label{margin:0; font-weight:400; cursor:pointer;}

  .bullets{margin:0; padding-left:18px; font-size:13.5px; line-height:1.7; color:var(--ink);}

  .nav-buttons{display:flex; justify-content:space-between; align-items:center; margin-top:6px;}
  .btn{
    border:none; border-radius:7px; padding:10px 18px; font-size:13.5px; font-weight:600;
    cursor:pointer; transition:opacity .15s; font-family:'Inter',sans-serif;
  }
  .btn-primary{background:var(--navy); color:#fff;}
  .social-mod .btn-primary{background:var(--social);}
  .btn-primary:hover{opacity:.88;}
  .btn-ghost{background:none; color:var(--ink-soft); border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--ink); border-color:#b7b4a7;}
  .btn[disabled]{opacity:.35; cursor:not-allowed;}

  .fill-badge{
    font-size:10.5px; color:var(--ink-soft); font-weight:500;
  }
  .fill-badge b{color:var(--ok);}

  .cover-fields{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .status-banner{
    display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:8px;
    background:#eef4ee; border:1px solid #cfe1cf; font-size:12.5px; color:#355a3f; margin-bottom:24px;
  }
  @media (max-width: 760px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; padding:18px;}
    .main{padding:24px 18px 60px;}
    .row2, .cover-fields{grid-template-columns:1fr;}
    .repeat-row, .repeat-row.two, .repeat-row.four{grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<script>
/* ============ CONTENT MODEL ============ */
const TRACK_STAGES = [
  {id:'t1', lane:'tech', name:'Pathway & Framing'},
  {id:'t2', lane:'tech', name:'Technological Testing'},
  {id:'t3', lane:'tech', name:'Evidence Saturation'},
  {id:'t4', lane:'tech', name:'Final Approval'},
  {id:'s1', lane:'social', name:'Beachhead Selection'},
  {id:'s2', lane:'social', name:'Trust Transfer'},
  {id:'s3', lane:'social', name:'Ex-Ante Consent'},
  {id:'s4', lane:'social', name:'Delegated Launch'},
];

const pages = [
  { key:'cover', label:'Cover Sheet', kind:'cover' },
  { key:'m1', label:'Module 1 — Pathway Mapping', kind:'module', track:'tech', stageMap:['t1','t1','t1','t2'] },
  { key:'m2', label:'Module 2 — Problem Framing', kind:'module', track:'tech', stageMap:['t1','t3','t3','t3'] },
  { key:'m3', label:'Module 3 — Community & Partnership', kind:'module', track:'social', stageMap:['s1','s2','s3','s4','s4'] },
  { key:'end', label:'How to Use This Package', kind:'end' },
];

let route = {page:'cover', step:0};
const state = { fields:{}, checks:{}, lists:{} };

function getField(id, def=''){ return state.fields[id] ?? def; }
function setField(id, val){ state.fields[id] = val; renderProgressUI(); }

/* ---------- repeatable list helpers ---------- */
function ensureList(id, cols, minRows){
  if(!state.lists[id]) state.lists[id] = Array.from({length:minRows}, ()=>cols.map(()=>''));
  return state.lists[id];
}
function addRow(id, cols){ state.lists[id].push(cols.map(()=>'')); render(); }
function rmRow(id, idx){ state.lists[id].splice(idx,1); render(); }

/* ============ MODULE STEP CONTENT ============ */
function step_m1(i){
  if(i===0) return {
    title:'Product Description', hint:'Describe the organism and modification for a scientific reviewer, then restate it in plain language.',
    body:`
      <label>Technical description</label>
      <textarea oninput="setField('m1_tech',this.value)" placeholder="Host organism, modification method, mechanism of action, containment characteristics...">${getField('m1_tech')}</textarea>
      <label>Plain-language description</label>
      <textarea oninput="setField('m1_plain',this.value)" placeholder="Same content, written for a non-specialist reader...">${getField('m1_plain')}</textarea>
    `
  };
  if(i===1) return {
    title:'Supporting Publications', hint:'List peer-reviewed publications substantiating safety, efficacy, and containment. Aim for three or more.',
    body: repeatTable('m1_pubs', ['Citation','Relevance','Peer-reviewed?'], 3)
  };
  if(i===2) return {
    title:'Proposed Classification & Rationale', hint:'State the classification you believe best fits the product — chosen for scientific fit, not procedural convenience.',
    body:`
      <div class="row2">
        <div><label>Proposed lead agency</label>
        <select onchange="setField('m1_agency',this.value)">
          <option ${sel('m1_agency','')}>Select...</option>
          <option ${sel('m1_agency','FDA')}>FDA</option>
          <option ${sel('m1_agency','USDA-APHIS')}>USDA-APHIS</option>
          <option ${sel('m1_agency','EPA')}>EPA</option>
        </select></div>
        <div><label>Proposed classification / category</label>
        <input type="text" value="${getField('m1_class')}" oninput="setField('m1_class',this.value)"></div>
      </div>
      <label>Rationale</label>
      <textarea oninput="setField('m1_rationale',this.value)" placeholder="Tie the classification to specific regulatory criteria (plant pest risk, TSCA novel-organism status, food/feed use...)">${getField('m1_rationale')}</textarea>
    `
  };
  return {
    title:'Alternatives, Path & Friction Points', hint:'Show your work: alternatives considered, the expected path, and where friction is likely to arise.',
    body: `
      <label>Alternative classifications considered</label>
      ${repeatTable('m1_alts', ['Alternative pathway','Lead agency','Why not selected'], 2)}
      <label style="margin-top:22px;">Anticipated friction points</label>
      ${repeatTable('m1_friction', ['Friction point','Why it may arise','How classification mitigates it'], 2)}
    `
  };
}

function step_m2(i){
  if(i===0) return {
    title:'Public Need & Recognized Goals', hint:'State the concrete problem this addresses, then show which recognized public goals it is genuinely responsive to.',
    body:`
      <label>Public need statement</label>
      <textarea oninput="setField('m2_need',this.value)" placeholder="Concrete problem, scale, and who is affected...">${getField('m2_need')}</textarea>
      <label>Linkage to recognized public goals</label>
      ${repeatTable('m2_goals', ['Goal / framework','How this product is responsive'], 2)}
    `
  };
  if(i===1) return {
    title:'Quantitative Evidence', hint:'Cite a source for every figure. Attach full datasets or charts as appendices — this is a summary space.',
    body:`
      <label>Evidence summary</label>
      <textarea oninput="setField('m2_evidence',this.value)" placeholder="Summarize the data substantiating problem scale and expected impact, with sources...">${getField('m2_evidence')}</textarea>
    `
  };
  if(i===2) return {
    title:'Actor Map', hint:'Standard actor categories from the Institutional Co-Governance mechanism — add a row only for a genuinely distinct category.',
    body: repeatTable('m2_actors', ['Actor category','Role','Engagement strategy'], 4, ['Beachhead community','Local institutional delegate','Federal / state regulators','Funders'])
  };
  return {
    title:'Reusable Framing Statement', hint:'150–250 words. This single statement is reused with regulators, funders, and the public — it must be accurate for all three at once.',
    body:`
      <textarea id="framing-ta" oninput="onFraming(this.value)" placeholder="Draft the framing statement here..." style="min-height:140px;">${getField('m2_framing')}</textarea>
      <div class="wc" id="framing-wc"></div>
      <label style="margin-top:20px;">Guidance on evidence saturation</label>
      <ul class="bullets">
        <li>Lead with what is independently verifiable; state uncertainty plainly.</li>
        <li>Don't use urgency or scale language beyond what your evidence supports.</li>
        <li>Prefer independent or peer-reviewed sources over developer-generated figures.</li>
        <li>Write for a skeptical outside reviewer, not a promotional audience.</li>
      </ul>
    `
  };
}

function step_m3(i){
  if(i===0) return {
    title:'Beachhead & Local Partner', hint:'Justify the community beyond logistical convenience, then name a specific candidate institution with independent standing.',
    body:`
      <label>Proposed beachhead community / market</label>
      <input type="text" value="${getField('m3_beachhead')}" oninput="setField('m3_beachhead',this.value)">
      <label>Justification</label>
      <textarea oninput="setField('m3_justify',this.value)" placeholder="Local need, existing assets, prior relationships, why this community specifically...">${getField('m3_justify')}</textarea>
      <label>Candidate institutional partner(s)</label>
      ${repeatTable('m3_partners', ['Institution','Type','Fit / rationale'], 2)}
      <div style="margin-top:24px;">
        <button class="btn btn-primary" onclick="renderActorNetwork()">Generate / Update Actor Network</button>
        <div id="actor-network" style="width:100%; height:420px; border:1px solid var(--line); border-radius:8px; margin-top:12px;"></div>
      </div>
    `
  };

  if(i===1) return {
    title:'Trust Transfer Plan', hint:'Describe what authority actually moves, and how the community will know the transfer occurred. Paper-only transfer will read as such.',
    body:`
      <textarea oninput="setField('m3_trust',this.value)" placeholder="What authority the partner will hold and by when; what the developer formally gives up; how this is documented (MOU, charter)..." style="min-height:120px;">${getField('m3_trust')}</textarea>
    `
  };
  if(i===2) return {
    title:'Multi-Year Timeline', hint:'Ex-ante consent must be able to alter the deployment decision — not just inform the community of one already made.',
    body:`
      <label>Relationship building & public education milestones</label>
      ${repeatTable('m3_relbuild', ['Milestone','Target date','Success indicator'], 2)}
      <label style="margin-top:18px;">Ex-ante consent mechanism(s)</label>
      ${repeatTable('m3_consent', ['Mechanism','Target date','Is outcome binding?'], 2)}
      <label style="margin-top:18px;">Delegated launch plan</label>
      <textarea oninput="setField('m3_launch',this.value)" placeholder="What launch looks like once the partner is the public-facing deployer...">${getField('m3_launch')}</textarea>
    `
  };
  if(i===3) return {
    title:'Risk Register & Resources', hint:'Name realistic risks to the social track specifically — a register of only minor risks reads as incomplete.',
    body:`
      ${repeatTable('m3_risks', ['Risk','Likelihood','Mitigation step(s)'], 3)}
      <label style="margin-top:20px;">Resource estimate</label>
      ${repeatTable('m3_resources', ['Category','Staff time','Budget'], 3, ['Community liaison staff','Public education & events','Advisory board administration'])}
    `
  };
  return {
    title:'Success Metrics — Social Track', hint:'Use indicators the developer does not solely control or report — independent surveys, partner reporting, consent-mechanism turnout.',
    body: repeatTable('m3_metrics', ['Metric','How it is measured'], 3)
  };
}

const MODULE_STEPS = { m1: step_m1, m2: step_m2, m3: step_m3 };
const MODULE_STEP_COUNT = { m1:4, m2:4, m3:5 };

/* ---------- small render helpers ---------- */
function sel(id,val){ return getField(id)===val ? 'selected' : ''; }

function repeatTable(id, cols, minRows, placeholders){
  const rows = ensureList(id, cols, minRows);
  const rowClass = cols.length===2?'two':cols.length===4?'four':'';
  let html = `<div class="repeat-list" id="list-${id}">`;
  rows.forEach((row,ri)=>{
    html += `<div class="repeat-row ${rowClass}">`;
    row.forEach((val,ci)=>{
      const ph = placeholders && placeholders[ri] && ci===0 ? placeholders[ri] : cols[ci];
      html += `<input type="text" value="${val.replace(/"/g,'&quot;')}" placeholder="${ph}"
        oninput="state.lists['${id}'][${ri}][${ci}]=this.value">`;
    });
    html += `<button class="rm-btn" onclick="rmRow('${id}',${ri})" title="Remove row">×</button>`;
    html += `</div>`;
  });
  html += `</div><button class="add-btn" onclick="addRow('${id}', ${JSON.stringify(cols)})">+ Add row</button>`;
  return html;
}

function onFraming(val){
  state.fields['m2_framing'] = val;
  const words = val.trim().split(/\s+/).filter(Boolean).length;
  const wc = document.getElementById('framing-wc');
  if(wc){
    wc.textContent = `${words} words (target: 150–250)`;
    wc.className = 'wc' + ((words>250)?' over':'');
  }
  renderProgressUI();
}

/* ============ STATIC PAGES ============ */
function renderCover(){
  return `
    <div class="eyebrow">Cover Sheet</div>
    <h1 class="page-title">Governance Readiness Framework</h1>
    <p class="page-sub">A voluntary, dual-track readiness tool for developers preparing an EMER regulatory submission under the U.S. Coordinated Framework (FDA / USDA / EPA). Click through the sidebar to complete each module.</p>

    <div class="card">
      <h3>Submission details</h3>
      <div class="cover-fields">
        <div><label>Company / lab name</label><input type="text" value="${getField('c_company')}" oninput="setField('c_company',this.value)"></div>
        <div><label>Product name / designation</label><input type="text" value="${getField('c_product')}" oninput="setField('c_product',this.value)"></div>
        <div><label>Date</label><input type="text" value="${getField('c_date')}" oninput="setField('c_date',this.value)" placeholder="e.g. August 2026"></div>
        <div><label>Primary contact</label><input type="text" value="${getField('c_contact')}" oninput="setField('c_contact',this.value)" placeholder="Name, title, email"></div>
        <div><label>Target agency(ies)</label>
          <select onchange="setField('c_agency',this.value)">
            <option ${sel('c_agency','')}>Select...</option>
            <option ${sel('c_agency','FDA')}>FDA</option>
            <option ${sel('c_agency','USDA-APHIS')}>USDA-APHIS</option>
            <option ${sel('c_agency','EPA')}>EPA</option>
            <option ${sel('c_agency','Multiple')}>Multiple</option>
          </select>
        </div>
        <div><label>Intended beachhead site(s)</label><input type="text" value="${getField('c_site')}" oninput="setField('c_site',this.value)"></div>
      </div>
    </div>

    <div class="card">
      <h3>Statement of purpose</h3>
      <p style="font-size:13.5px; line-height:1.6; color:var(--ink);">This package is a voluntary supplementary document intended to accompany a formal regulatory application. It does not replace any required filing and confers no independent regulatory status — its purpose is to demonstrate, in one place, that both tracks of the Institutional Co-Governance mechanism have been deliberately planned before deployment.</p>
    </div>

    <div class="card">
      <h3>Package contents</h3>
      <ul class="checklist">
        <li><input type="checkbox" ${state.checks.mod1?'checked':''} onchange="state.checks.mod1=this.checked; renderProgressUI()"> <label>Module 1 — Regulatory Pathway Mapping</label></li>
        <li><input type="checkbox" ${state.checks.mod2?'checked':''} onchange="state.checks.mod2=this.checked; renderProgressUI()"> <label>Module 2 — Problem Framing and Scientific Communication</label></li>
        <li><input type="checkbox" ${state.checks.mod3?'checked':''} onchange="state.checks.mod3=this.checked; renderProgressUI()"> <label>Module 3 — Community Engagement and Institutional Partnership Plan</label></li>
      </ul>
    </div>

    <div class="nav-buttons">
      <span></span>
      <button class="btn btn-primary" onclick="goPage('m1')">Start Module 1 →</button>
    </div>
  `;
}

function renderEnd(){
  const items = [
    'Complete Module 1 first — the classification decided there determines the lead agency and how much scrutiny Module 3 will need to withstand.',
    'Draft Module 2 before finalizing Module 3\'s public materials. The framing statement is the single source of language reused publicly — do not write separate messaging per audience.',
    'Treat Module 3 as the long-lead item. A genuine local partner and ex-ante consent mechanism usually take longer than the regulatory review itself.',
    'This package supplements, and never replaces, formal FDA / USDA-APHIS / EPA application materials.',
    'Revisit all three modules if the classification or beachhead community changes — they are interdependent.',
    'Before submission, have Module 3 reviewed by someone outside the developer organization, ideally able to represent the beachhead community\'s perspective.'
  ];
  return `
    <div class="eyebrow">Wrap-Up</div>
    <h1 class="page-title">How to Use This Package</h1>
    <p class="page-sub">Sequencing guidance for putting the three modules together before submission.</p>
    <div class="card">
      <ol class="bullets" style="padding-left:20px;">
        ${items.map(t=>`<li style="margin-bottom:10px;">${t}</li>`).join('')}
      </ol>
    </div>
    <div class="nav-buttons">
      <button class="btn btn-ghost" onclick="goPage('m3', 4)">← Back to Module 3</button>
      <span class="fill-badge">${fillSummary()}</span>
    </div>
  `;
}

/* ============ MODULE PAGE RENDER ============ */
function renderModule(pageKey){
  const page = pages.find(p=>p.key===pageKey);
  const total = MODULE_STEP_COUNT[pageKey];
  const step = Math.min(route.step, total-1);
  const content = MODULE_STEPS[pageKey](step);
  const isSocial = page.track === 'social';

  const dots = Array.from({length:total}, (_,i)=>
    `<span class="${i===step?'on':''}" onclick="goPage('${pageKey}',${i})"></span>`).join('');

  return `
    <div class="${isSocial?'social-mod':''}">
      <div class="eyebrow">${page.label}</div>
      <h1 class="page-title">${content.title}</h1>
      <div class="stepper-head">
        <span class="step-pill">${isSocial?'Social Track':'Technological Track'}</span>
        <span style="font-size:12px;color:var(--ink-soft);">Step ${step+1} of ${total}</span>
        <div class="step-dots">${dots}</div>
      </div>
      <div class="card">
        <div class="hint">${content.hint}</div>
        ${content.body}
      </div>
      <div class="nav-buttons">
        <button class="btn btn-ghost" onclick="stepNav(-1)" ${step===0?'disabled':''}>← Back</button>
        <span class="fill-badge">${fillSummary()}</span>
        ${step<total-1
          ? `<button class="btn btn-primary" onclick="stepNav(1)">Next →</button>`
          : `<button class="btn btn-primary" onclick="nextModule()">${nextModuleLabel()}</button>`}
      </div>
    </div>
  `;
}

function nextModuleLabel(){
  const order = ['m1','m2','m3','end'];
  const idx = order.indexOf(route.page);
  if(route.page==='m3') return 'Finish → How to Use';
  return `Next: Module ${order.indexOf(route.page)+2} →`;
}
function nextModule(){
  const order = ['m1','m2','m3','end'];
  const idx = order.indexOf(route.page);
  goPage(order[idx+1] ?? 'end');
}
function stepNav(delta){
  route.step = Math.max(0, route.step + delta);
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

/* ============ ROUTING ============ */
function goPage(key, step=0){
  route = {page:key, step};
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

function fillSummary(){
  const filled = Object.values(state.fields).filter(v=>v && v.trim && v.trim().length>0).length;
  return `<b>${filled}</b> fields drafted this session`;
}

/* ============ SIDEBAR ============ */
function renderSidebar(){
  const el = document.getElementById('sidebar');
  el.innerHTML = `
    <div class="brand">Governance Readiness<br>Framework</div>
    <div class="brand-sub">Interactive worksheet</div>
    ${pages.map(p=>`
      <div class="nav-item ${route.page===p.key?'active':''}" onclick="goPage('${p.key}')">
        <span class="nav-dot"></span>${p.label}
      </div>
    `).join('')}
    <div style="margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,.08); font-size:10.5px; color:#7a839e; line-height:1.6;">
      Content held in-browser for this session only — nothing is uploaded or saved automatically. Export or copy your entries before closing the tab.
    </div>
  `;
}

/* ============ TRACK DIAGRAM ============ */
function renderTrack(){
  const page = pages.find(p=>p.key===route.page);
  let activeStage = null;
  if(page && page.kind==='module'){
    activeStage = page.stageMap[Math.min(route.step, page.stageMap.length-1)];
  }
  const activeIdx = activeStage ? TRACK_STAGES.findIndex(s=>s.id===activeStage) : -1;

  function laneHtml(lane){
    return TRACK_STAGES.filter(s=>s.lane===lane).map((s)=>{
      const globalIdx = TRACK_STAGES.findIndex(x=>x.id===s.id);
      const passedTech = lane==='tech' && activeIdx>=0 && globalIdx<=activeIdx && TRACK_STAGES[activeIdx].lane==='tech';
      const passedSocial = lane==='social' && activeIdx>=0 && globalIdx<=activeIdx && TRACK_STAGES[activeIdx].lane==='social';
      const isCurrent = s.id===activeStage;
      let cls = 'stage';
      if(passedTech) cls+=' tech-on';
      if(passedSocial) cls+=' social-on';
      if(isCurrent) cls+=' current';
      return `<div class="${cls}"><div class="connector"></div><div class="dot"></div><div class="stage-name">${s.name}</div></div>`;
    }).join('');
  }

  return `
    <div class="track">
      <div class="track-label">Institutional Co-Governance — Dual Track</div>
      <div class="track-row"><span class="lane-label">TECHNICAL</span><div class="lane">${laneHtml('tech')}</div></div>
      <div class="track-row" style="margin-top:14px;"><span class="lane-label">SOCIAL</span><div class="lane">${laneHtml('social')}</div></div>
    </div>
  `;
}

/* ============ MAIN RENDER ============ */
function render(){
  const page = pages.find(p=>p.key===route.page);
  const main = document.getElementById('main');
  let html = renderTrack();
  if(page.kind==='cover') html += renderCover();
  else if(page.kind==='end') html += renderEnd();
  else html += renderModule(page.key);
  main.innerHTML = html;

  // restore word counter for framing step
  if(route.page==='m2' && route.step===3){
    onFraming(getField('m2_framing'));
  }
  renderSidebar();
}
function renderProgressUI(){
  // lightweight refresh of fill badges without full re-render (avoids losing focus)
  document.querySelectorAll('.fill-badge').forEach(el=> el.innerHTML = fillSummary());
}

function renderActorNetwork(){
  const categoryColors = [
    { match:/beachhead/i,        color:'#8a5a34' },
    { match:/delegate|partner/i, color:'#2e6f4e' },
    { match:/regulator|fbi|fda|usda|epa/i, color:'#7a4fa0' },
    { match:/opposition|advocacy/i, color:'#a3432f' },
    { match:/funder/i,           color:'#c9971f' },
    { match:/state|federal|political/i, color:'#4f6b8a' },
    { match:/public|resident/i,  color:'#6b6858' },
  ];
  function colorFor(text){
    const hit = categoryColors.find(c => c.match.test(text));
    return hit ? hit.color : '#999999';
  }

  const actorRows = (state.lists['m3_partners'] || []).filter(r => r[0] && r[0].trim());

  const nodes = new vis.DataSet([
    { id: 0, label: 'Our Lab', shape:'dot', size:30,
      color:{ background:'#1f3864', border:'#ffffff' },
      font:{ color:'#1f3864', size:15, vadjust:-24, bold:true } },
    ...actorRows.map((row, i) => ({
      id: i + 1,
      label: row[0],
      title: [row[1] ? `Type: ${row[1]}` : '', row[2] ? row[2] : ''].filter(Boolean).join('\n'),
      shape: 'dot', size: 22,
      color: { background: colorFor(row[0] + ' ' + row[1]), border: '#ffffff' },
      font: { color: '#26241f', size: 13, vadjust:-20 },
    })),
  ]);

  const edges = new vis.DataSet(
    actorRows.map((row, i) => ({ from: 0, to: i + 1, color: { color: '#c9c6ba' } }))
  );

  const container = document.getElementById('actor-network');
  const options = {
    physics: {
      forceAtlas2Based: { gravitationalConstant: -60, springLength: 140 },
      solver: 'forceAtlas2Based',
      stabilization: { iterations: 150 },
    },
    interaction: { hover: true, dragNodes: true, zoomView: true },
    edges: { smooth: { type: 'continuous' } },
  };

  new vis.Network(container, { nodes, edges }, options);
}


render();
</script>
</body>
</html>
